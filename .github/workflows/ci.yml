name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks run here too, and get no secrets (the tests need none).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff==0.17.0
      - run: ruff check .
      - run: python -m pytest -q
