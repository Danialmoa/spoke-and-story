services:
  - type: web
    name: spoke-and-story
    runtime: python
    # The free plan sleeps after 15 idle minutes and takes ~1 min to wake: judges would see a blank page.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # No access log: query strings carry typed addresses and positions (/api/places?q=...&near=lat,lon).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    domains:
      - spoke-and-story.tech
    envVars:
      # numpy 1.26.4 has prebuilt Linux wheels up to Python 3.12.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_MODEL
        value: gemma-4-26b-a4b-it
      - key: ORS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_MODEL
        value: google/gemma-4-26b-a4b-it
      - key: SENTRY_DSN
        sync: false
